name: sast

on: [push, pull_request]

permissions:
  contents: read
  security-events: write

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Semgrep scan
        id: semgrep
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.145.0 \
            semgrep scan --config=p/ci --config=.semgrep/ \
              --sarif --output=semgrep.sarif --error --metrics=off \
              lib routes models

      - name: Upload SARIF vers l'onglet Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Seuil de blocage
        if: steps.semgrep.outcome == 'failure'
        run: |
          echo "::error::Semgrep a remonte des findings bloquants"
          exit 1

  secret-detection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks scan de l'historique Git
        id: gitleaks
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/path" -w /path \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --report-format sarif \
              --report-path /path/gitleaks.sarif \
              --exit-code 1 --redact .

      - name: Publier le rapport gitleaks
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif

      - name: Seuil de blocage
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo "::error::Gitleaks a remonte des secrets bloquants"
          exit 1
